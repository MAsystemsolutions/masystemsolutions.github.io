<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co-op Fund &amp; Lending Portal – Live Demo | MA System Solutions</title>
<meta name="description" content="Interactive demo of the Co-op Fund &amp; Lending Portal: member deposits, loans with amortization, dividends and member exits. Built by Mia Marie Briones.">
<meta name="author" content="Mia Marie Briones">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0F1729">
<link rel="icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--accent:#2F6FED;--accent-ink:#fff;--accent-soft:rgba(47,111,237,.1);--ink:#0F172A;--sub:#64748B;--muted:#94A3B8;--line:#E6E8EF;--bg:#F5F6FA;--card:#fff;--side:#0F1729;--side-ink:#AEB8CB;--ok:#15803D;--ok-bg:#E7F6EC;--warn:#B45309;--warn-bg:#FEF3E2;--bad:#B91C1C;--bad-bg:#FDECEC;--info:#1D4ED8;--info-bg:#E8EFFD;--gray-bg:#EEF0F4;--r:12px;--sh:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.05)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:#fff}
.brand-ico{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:19px;flex:none}
.brand b{display:block;font-size:15px;line-height:1.2}.brand small{font-size:11px;color:var(--side-ink)}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#6B7890;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:500}
.nav a i{font-size:18px}.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:rgba(255,255,255,.1);color:#fff}
.nav a.active i{color:var(--accent-2,var(--accent))}
.nav .count{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:999px;color:#fff}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:14px}
.role{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:rgba(255,255,255,.05)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;background:var(--accent-soft);color:var(--accent);flex:none}
.side .avatar{background:rgba(255,255,255,.12);color:#fff}
.role b{display:block;color:#fff;font-size:13px;line-height:1.2}.role small{font-size:11px}
.role select{margin-top:8px;width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:6px 8px;font-size:12px}
.role select option{color:#000}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.demo-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 24px;background:#111A2E;color:#D7DEEA;font-size:12.5px}
.demo-bar .pill{background:#C9A227;color:#14213D;font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:5px}
.demo-bar .sp{flex:1}
.demo-bar button,.demo-bar a{background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.demo-bar a.cta{background:#C9A227;border-color:#C9A227;color:#14213D;font-weight:600}
.top{height:64px;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
.top .crumb{font-size:12px;color:var(--sub)}
.top .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 11px;width:260px;color:var(--sub)}
.search input{border:0;background:transparent;outline:none;width:100%}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--sub);font-size:18px;position:relative}
.icon-btn:hover{color:var(--ink)}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.menu-toggle{display:none}
.content{padding:24px;display:flex;flex-direction:column;gap:18px;max-width:1400px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:22px;letter-spacing:-.02em;font-weight:700}
.page-head p{margin:2px 0 0;color:var(--sub)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* cards */
.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:14px;font-weight:650}.card-h small{color:var(--sub)}
.card-b{padding:16px 18px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .lbl{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:12.5px;font-weight:500}
.kpi .lbl i{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:16px}
.kpi .val{font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi .delta{font-size:12px;color:var(--sub)}.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:550;font-size:13px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#CBD2DE}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn i{font-size:16px}
/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--gray-bg);color:#475569}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.info{background:var(--info-bg);color:var(--info)}.badge.acc{background:var(--accent-soft);color:var(--accent)}
.badge .d{width:6px;height:6px;border-radius:50%;background:currentColor}
/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--sub);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;border-bottom:1px solid var(--line);background:#FAFBFC;white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}.tbl tbody tr.click:hover{background:#FAFBFD}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.cell-main{display:flex;align-items:center;gap:10px}.cell-main b{display:block;font-weight:600}.cell-main small{color:var(--sub)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar .search{width:240px;background:var(--card)}
select.sel,input.inp,textarea.inp{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--card);outline:none}
select.sel:focus,input.inp:focus,textarea.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.empty{padding:40px;text-align:center;color:var(--sub)}
/* progress */
.bar{height:7px;background:var(--gray-bg);border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.health{display:inline-flex;align-items:center;gap:8px;min-width:110px}.health .bar{flex:1;min-width:50px}
/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line)}.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}.li b{font-weight:600}.li small{color:var(--sub);display:block}
.ico-sq{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:17px;flex:none}
/* timeline */
.tl{display:flex;flex-direction:column;gap:0;padding-left:4px}
.tl-i{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl-i:before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line)}
.tl-i:last-child:before{display:none}
.tl-i .ico-sq{width:30px;height:30px;border-radius:50%;font-size:14px}
.tl-i .grow{flex:1;min-width:0}.tl-i small{color:var(--sub)}
.tl-i p{margin:4px 0 0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
/* kanban */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{background:#EEF0F5;border-radius:12px;min-width:260px;width:260px;flex:none;display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;font-weight:650;font-size:13px}
.col-h .n{background:#fff;border-radius:999px;padding:0 8px;font-size:11.5px;color:var(--sub)}
.col-b{padding:0 10px 10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:60px}
.col-b.over{background:var(--accent-soft);border-radius:10px}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:grab;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.kc:hover{border-color:#CBD2DE}.kc b{display:block;font-size:13px}.kc small{color:var(--sub)}
.kc .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px}
/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);z-index:60;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(15,23,42,.15)}
.drawer.open{transform:none}
.dr-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.dr-h h3{margin:0;font-size:18px}.dr-h .grow{flex:1;min-width:0}
.dr-b{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.dr-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal .box{background:var(--card);border-radius:14px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(15,23,42,.25);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px}.f.full{grid-column:1/-1}
.f label{font-size:12px;font-weight:600;color:#334155}
.f .inp,.f .sel{width:100%}
.f .err{color:var(--bad);font-size:11.5px;display:none}.f.bad .err{display:block}.f.bad .inp{border-color:var(--bad)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.kv small{display:block;color:var(--sub);font-size:11.5px}.kv b{font-weight:600}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);font-weight:700;margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 18px}
.tab{padding:11px 12px;border:0;background:none;cursor:pointer;color:var(--sub);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--ink);border-bottom-color:var(--accent)}
/* stepper */
.steps{display:flex;gap:0;overflow-x:auto;padding:4px 0 8px}
.step{flex:1;min-width:84px;text-align:center;position:relative;font-size:11px;color:var(--sub)}
.step .c{width:26px;height:26px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--gray-bg);color:var(--sub);font-weight:700;font-size:11px;position:relative;z-index:1}
.step:before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:2px;background:var(--line)}
.step:first-child:before{display:none}
.step.done .c{background:var(--accent);color:var(--accent-ink)}.step.done:before,.step.cur:before{background:var(--accent)}
.step.cur .c{background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.step.cur{color:var(--ink);font-weight:600}
/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-size:11px;fill:var(--sub);font-family:inherit}
.legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.legend span{display:flex;align-items:center;gap:8px}.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-weight:600}
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
/* toast */
.toasts{position:fixed;bottom:18px;right:18px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:#0F172A;color:#fff;padding:11px 14px;border-radius:10px;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:pop .2s ease}
.toast i{color:#4ADE80;font-size:17px}
/* feed */
.feed-in{display:flex;gap:8px;margin-top:4px}.feed-in .inp{flex:1}
.mention{color:var(--accent);font-weight:600}
/* utility */
.muted{color:var(--sub)}.right{text-align:right}.nowrap{white-space:nowrap}.mt0{margin-top:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.big{font-size:20px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:12.5px;font-weight:550}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
/* responsive */
@media (max-width:1100px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-21{grid-template-columns:1fr}.g-3{grid-template-columns:1fr 1fr}.search{display:none}}
@media (max-width:860px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:80;transform:translateX(-100%);transition:transform .25s}
 .side.open{transform:none}
 .menu-toggle{display:grid}
 .top{padding:0 14px}.content{padding:16px}.demo-bar{padding:8px 14px}
 .g-3,.g-2{grid-template-columns:1fr}
 .form{grid-template-columns:1fr}
 .donut-wrap{grid-template-columns:120px 1fr}
 .kv{grid-template-columns:1fr 1fr}
 .demo-bar .hide-sm{display:none}
}
@media (max-width:520px){.g-4{grid-template-columns:1fr 1fr}.kpi .val{font-size:21px}.top h1{font-size:16px}}

</style>
</head>

<script>
/* MA System Solutions – demo kit (sample data only, no server) */
(function () {
  'use strict';
  var PORTFOLIO = 'https://masystemsolutions.github.io/';
  var K = window.K = {};

  /* ---------- utils ---------- */
  K.esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  K.uid = function (p) { return (p || 'id') + '-' + Math.random().toString(36).slice(2, 8); };
  K.today = function () { var d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  K.addDays = function (d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; };
  K.iso = function (d) { var x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
  K.day = function (n) { return K.iso(K.addDays(K.today(), n)); };
  K.parse = function (s) { var p = String(s).slice(0, 10).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
  K.dfmt = function (s) { if (!s) return '—'; return K.parse(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };
  K.dshort = function (s) { if (!s) return '—'; return K.parse(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
  K.diff = function (s) { return Math.round((K.parse(s) - K.today()) / 864e5); };
  K.rel = function (s) {
    var n = K.diff(s);
    if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow'; if (n === -1) return 'Yesterday';
    return n > 0 ? 'In ' + n + ' days' : Math.abs(n) + ' days ago';
  };
  K.ago = function (ts) {
    var m = Math.round((Date.now() - ts) / 6e4);
    if (m < 1) return 'Just now'; if (m < 60) return m + 'm ago';
    var h = Math.round(m / 60); if (h < 24) return h + 'h ago';
    var d = Math.round(h / 24); return d + 'd ago';
  };
  K.num = function (n, dp) { return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 }); };
  K.money = function (n, cur, dp) {
    cur = cur || (K.APP && K.APP.currency) || 'USD';
    var sym = cur === 'PHP' ? '₱' : '$';
    var v = Math.round(Number(n || 0) * Math.pow(10, dp || 0)) / Math.pow(10, dp || 0);
    return (v < 0 ? '-' : '') + sym + K.num(Math.abs(v), dp || 0);
  };
  K.compact = function (n, cur) {
    var sym = cur === 'PHP' ? '₱' : cur === 'USD' ? '$' : '';
    var a = Math.abs(n);
    if (a >= 1e6) return sym + (n / 1e6).toFixed(a >= 1e7 ? 1 : 2).replace(/\.0+$/, '') + 'M';
    if (a >= 1e3) return sym + (n / 1e3).toFixed(a >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'K';
    return sym + K.num(n);
  };
  K.initials = function (n) { return String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase(); };
  K.pick = function (arr, i) { return arr[i % arr.length]; };
  K.badge = function (t, cls, dot) { return '<span class="badge ' + (cls || '') + '">' + (dot ? '<span class="d"></span>' : '') + K.esc(t) + '</span>'; };
  K.avatar = function (name, color) { return '<span class="avatar"' + (color ? ' style="background:' + color + '22;color:' + color + '"' : '') + '>' + K.esc(K.initials(name)) + '</span>'; };
  K.sum = function (a, f) { return a.reduce(function (s, x) { return s + (f ? f(x) : x); }, 0); };

  /* ---------- store (this browser only) ---------- */

  K.PAL = PAL;
  K.bars = function (data, o) {

      return '<div><div class="row" style="justify-content:space-between;font-size:12.5px;margin-bottom:4px"><span>' + K.esc(d.l) + '</span><b>' + (o.fmt ? o.fmt(d.v) : K.num(d.v)) + '</b></div><div class="bar"><span style="width:' + (100 * d.v / max) + '%;background:' + (d.c || PAL[i % PAL.length]) + '"></span></div></div>';
    }).join('') + '</div>';
  };
  K.line = function (labels, series, o) {
    o = o || {}; var W = window.innerWidth < 700 ? 480 : (o.w || 560), H = o.h || 220, pl = 44, pb = 28, pt = 10, n = labels.length;
    var all = []; series.forEach(function (s) { all = all.concat(s.v); });
    var raw = Math.max.apply(null, all.concat([1])), max = o.int ? Math.max(4, Math.ceil(raw / 4) * 4) : niceMax(raw);
    var g = '', step = (W - pl - 10) / Math.max(n - 1, 1);
    for (var i = 0; i <= 4; i++) { var y = pt + (H - pt - pb) * (1 - i / 4); g += '<line x1="' + pl + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)"/><text x="' + (pl - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + (o.fmt ? o.fmt(max * i / 4) : K.compact(max * i / 4)) + '</text>'; }

    series.forEach(function (s, si) {
      var c = s.c || PAL[si], pts = s.v.map(function (v, i) { return [pl + i * step, pt + (H - pt - pb) * (1 - v / max)]; });

      if (si === 0 && o.area !== false) g += '<path d="' + d + ' L' + pts[pts.length - 1][0] + ' ' + (H - pb) + ' L' + pl + ' ' + (H - pb) + ' Z" fill="' + c + '" opacity=".08"/>';

      pts.forEach(function (p, i) { g += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.5" fill="#fff" stroke="' + c + '" stroke-width="2"><title>' + K.esc(s.n || '') + ' ' + K.esc(labels[i]) + ': ' + (o.fmt ? o.fmt(s.v[i]) : K.num(s.v[i])) + '</title></circle>'; });

    var leg = series.length > 1 ? '<div class="row" style="gap:14px;font-size:12px;margin-top:6px">' + series.map(function (s, si) { return '<span class="row" style="gap:6px"><i style="width:10px;height:10px;border-radius:3px;background:' + (s.c || PAL[si]) + '"></i>' + K.esc(s.n) + '</span>'; }).join('') + '</div>' : '';
    return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' + g + '</svg>' + leg + '</div>';
  };
  K.donut = function (segs, o) {
    o = o || {}; var tot = K.sum(segs, function (s) { return s.v; }) || 1, R = 60, r = 42, a0 = -Math.PI / 2, g = '';
    segs.forEach(function (s, i) {

      else if (s.v > 0) g += '<path d="M' + (70 + R * Math.cos(a0)) + ' ' + (70 + R * Math.sin(a0)) + ' A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + (70 + R * Math.cos(a1)) + ' ' + (70 + R * Math.sin(a1)) + ' L' + (70 + r * Math.cos(a1)) + ' ' + (70 + r * Math.sin(a1)) + ' A' + r + ' ' + r + ' 0 ' + large + ' 0 ' + (70 + r * Math.cos(a0)) + ' ' + (70 + r * Math.sin(a0)) + ' Z" fill="' + c + '"><title>' + K.esc(s.l) + ': ' + (o.fmt ? o.fmt(s.v) : K.num(s.v)) + '</title></path>';
      a0 = a1;
    });
    g += '<text x="70" y="68" text-anchor="middle" style="font-size:18px;font-weight:700;fill:var(--ink)">' + K.esc(o.center || K.num(tot)) + '</text><text x="70" y="86" text-anchor="middle">' + K.esc(o.centerLabel || 'Total') + '</text>';
    var leg = '<div class="legend">' + segs.map(function (s, i) { return '<span><i style="background:' + (s.c || PAL[i % PAL.length]) + '"></i>' + K.esc(s.l) + '<b>' + (o.fmt ? o.fmt(s.v) : K.num(s.v)) + '</b></span>'; }).join('') + '</div>';
    return '<div class="donut-wrap"><div class="chart"><svg viewBox="0 0 140 140" role="img">' + g + '</svg></div>' + leg + '</div>';
  };
  function niceMax(m) { if (m <= 0) return 1; var p = Math.pow(10, Math.floor(Math.log10(m))), f = m / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 4 ? 4 : f <= 6 ? 6 : f <= 8 ? 8 : 10) * p; }

  /* ---------- kanban ---------- */
  // cols:[{id,label}], items, o:{col:item=>colId, card:item=>html, onMove:(item,colId)=>{}, onOpen:item=>{}}

  K.start = function (APP) {

      '<div class="main"><div class="demo-bar"><span class="pill">Demo</span><span class="hide-sm">Sample data only. Your changes stay in this browser.</span><span class="sp"></span><button type="button" id="resetBtn"><i class="ti ti-refresh"></i> Reset demo</button><a class="cta" href="' + inquire + '" target="_top"><i class="ti ti-sparkles"></i> Get this system</a></div>' +
      '<header class="top"><button class="icon-btn menu-toggle" id="menuBtn" aria-label="Menu"><i class="ti ti-menu-2"></i></button><div><div class="crumb">' + K.esc(APP.name) + '</div><h1 id="topTitle"></h1></div><span class="sp"></span>' +

<script>
(function () {
  var E = K.esc, P = function (n, dp) { return K.money(n, 'PHP', dp); };
  var RATE = 0.01; // 1% per month, diminishing balance
  var DEPTS = ['Operations', 'Finance', 'Sales', 'IT', 'HR', 'Customer care'];
  var ME_MEMBER = 'M-001';

  function amort(p, n) { return Math.round(p * RATE / (1 - Math.pow(1 + RATE, -n)) * 100) / 100; }
  function monthsAgo(n, day) { var d = K.today(); d.setDate(1); d.setMonth(d.getMonth() - n); d.setDate(day || 15); return K.iso(d); }
  function addMonths(s, n) { var d = K.parse(s); d.setMonth(d.getMonth() + n); return K.iso(d); }

  function seed() {
    var names = ['Ana Santos', 'Mark dela Cruz', 'Joy Reyes', 'Paolo Garcia', 'Kim Villanueva', 'Rhea Mendoza', 'Carlo Bautista', 'Liza Flores', 'Jun Navarro', 'Grace Ramos', 'Ben Aquino', 'Tess Castillo', 'Rafael Lim', 'Mae Torres'];
    var monthly = [1500, 1000, 2000, 500, 1000, 1500, 800, 1000, 2000, 500, 1200, 1000, 1500, 700];
    var members = [], deposits = [];
    names.forEach(function (n, i) {
      var id = 'M-' + String(i + 1).padStart(3, '0'), joinedAgo = i < 10 ? 14 : 14 - (i - 8) * 2;
      members.push({ id: id, name: n, dept: DEPTS[i % DEPTS.length], joined: monthsAgo(joinedAgo, 1), status: 'Active', email: n.toLowerCase().replace(/ /g, '.') + '@company.ph', monthly: monthly[i] });
      for (var m = Math.min(joinedAgo, 12); m >= 0; m--) {
        deposits.push({ id: K.uid('d'), member: id, date: monthsAgo(m, m === 0 ? Math.min(15, new Date().getDate()) : 15), amount: monthly[i], type: 'Share capital', note: 'Payroll deduction' });
        if (m > 0 && (i + m) % 4 === 0) deposits.push({ id: K.uid('d'), member: id, date: monthsAgo(m, 28), amount: 1000 + (i % 3) * 500, type: 'Savings', note: 'Voluntary savings' });
      }
    });
    var loans = [];
    function loan(mi, principal, term, startAgo, status, purpose) {
      var l = { id: 'LN-' + (1001 + loans.length), member: members[mi].id, principal: principal, term: term, start: monthsAgo(startAgo, 5), purpose: purpose, status: status, applied: monthsAgo(startAgo, 1), payments: [] };

    var months = [], bal12 = [], run = 0, D = deps(id).slice().sort(K.by('date'));
    for (var i = 11; i >= 0; i--) { var d = K.today(); d.setDate(1); d.setMonth(d.getMonth() - i + 1); months.push(new Date(d.getFullYear(), d.getMonth() - 1, 1).toLocaleDateString('en-US', { month: 'short' })); bal12.push(K.sum(D.filter(function (x) { return K.parse(x.date) < d && x.type !== 'Withdrawal'; }), function (x) { return x.amount; })); }
    el.innerHTML = '<div class="page-head"><div><h2>Hi ' + E(m.name.split(' ')[0]) + ', here’s your account</h2><p>Member ' + E(m.id) + ' · ' + P(m.monthly) + ' monthly payroll deduction</p></div><div class="actions"><button class="btn primary" id="ap"><i class="ti ti-cash"></i>Apply for a loan</button></div></div>' +
      '<div class="grid g-4">' + kpi('ti-coins', 'My share capital', P(share(id)), '<span class="delta up">Earns dividends</span>') + kpi('ti-pig-money', 'My savings', P(savings(id)), '<span class="delta">Withdrawable</span>') + kpi('ti-cash', 'My loan balance', P(loanBal(id), 2), '<span class="delta">' + L.filter(function (l) { return l.status === 'Active'; }).length + ' active loan(s)</span>') + kpi('ti-gift', 'Est. dividend', P(est, 2), '<span class="delta up">Based on interest earned so far</span>') + '</div>' +
      '<div class="grid g-21"><div class="card"><div class="card-h"><h3>My equity growth</h3><small>Last 12 months</small></div><div class="card-b">' + K.line(months, [{ n: 'Equity', v: bal12 }], { w: 760, fmt: function (v) { return K.compact(v, 'PHP'); } }) + '</div></div>' +
      '<div class="card"><div class="card-h"><h3>My loans</h3></div><div class="list">' + (L.map(function (l) { return '<div class="li" data-loan="' + l.id + '" style="cursor:pointer"><span class="ico-sq"><i class="ti ti-cash"></i></span><div class="grow"><b>' + P(l.principal) + ' · ' + E(l.purpose) + '</b><small>' + E(l.id) + ' · ' + l.term + ' months</small></div>' + stB(l.status) + '</div>'; }).join('') || '<div class="empty">No loans yet.</div>') + '</div></div></div>' +
      '<div class="card"><div class="card-h"><h3>My transactions</h3><button class="btn sm" data-m="' + id + '">Full statement</button></div><div class="list">' + D.slice().reverse().slice(0, 6).map(function (d) { return '<div class="li"><span class="ico-sq" style="background:var(--ok-bg);color:var(--ok)"><i class="ti ti-arrow-down-left"></i></span><div class="grow"><b>' + E(d.type) + '</b><small>' + K.dfmt(d.date) + ' · ' + E(d.note || '') + '</small></div><b>+' + P(d.amount) + '</b></div>'; }).join('') + '</div></div>';
    el.querySelector('#ap').onclick = function () { loanModal(id); };
    wire(el);
  }

  var F = { q: '', st: 'Active' };
  function membersView(el) {
    if (isMember()) { openMember(ME_MEMBER); return myAccount(el); }
    el.innerHTML = '<div class="page-head"><div><h2>Members</h2><p>Balances, loans and statements for every member.</p></div><div class="actions"><button class="btn primary" id="add"><i class="ti ti-user-plus"></i>Add member</button></div></div>' +
      '<div class="card"><div class="toolbar"><label class="search"><i class="ti ti-search"></i><input id="q" placeholder="Search name or ID" value="' + E(F.q) + '"></label><select class="sel" id="st"><option value="Active"' + (F.st === 'Active' ? ' selected' : '') + '>Active</option><option value="Exited"' + (F.st === 'Exited' ? ' selected' : '') + '>Exited</option><option value="all"' + (F.st === 'all' ? ' selected' : '') + '>All members</option></select><span class="muted" id="cnt" style="margin-left:auto"></span></div><div class="tbl-wrap" id="tw"></div></div>';
    function draw() {
      var rows = K.db.members.filter(function (m) { return (F.st === 'all' || m.status === F.st) && (!F.q || (m.name + ' ' + m.id).toLowerCase().indexOf(F.q.toLowerCase()) > -1); });
      el.querySelector('#cnt').textContent = rows.length + ' members';
      el.querySelector('#tw').innerHTML = '<table class="tbl"><thead><tr><th>Member</th><th>Department</th><th class="num">Monthly</th><th class="num">Share capital</th><th class="num">Savings</th><th class="num">Loan balance</th><th>Status</th></tr></thead><tbody>' + rows.map(function (m) { var lb = loanBal(m.id); return '<tr class="click" data-m="' + m.id + '"><td><div class="cell-main">' + K.avatar(m.name, '#15803D') + '<div><b>' + E(m.name) + '</b><small>' + E(m.id) + ' · since ' + K.dfmt(m.joined) + '</small></div></div></td><td>' + E(m.dept) + '</td><td class="num">' + P(m.monthly) + '</td><td class="num">' + P(share(m.id)) + '</td><td class="num">' + P(savings(m.id)) + '</td><td class="num"' + (lb ? ' style="color:var(--bad)"' : '') + '>' + (lb ? P(lb, 2) : '—') + '</td><td>' + stB(m.status) + '</td></tr>'; }).join('') + '</tbody></table>';
      wire(el);
    }
    el.querySelector('#q').oninput = function (e) { F.q = e.target.value; draw(); };
    el.querySelector('#st').onchange = function (e) { F.st = e.target.value; draw(); };
    el.querySelector('#add').onclick = function () {
      K.modal({ title: 'Add member', body: K.formHTML([{ k: 'name', label: 'Full name', req: true, ph: 'Juan dela Cruz' }, { k: 'dept', label: 'Department', type: 'select', opts: DEPTS }, { k: 'email', label: 'Email', type: 'email', req: true, ph: 'juan@company.ph', err: 'Enter a valid email' }, { k: 'monthly', label: 'Monthly deduction (₱)', type: 'number', req: true, val: 1000, err: 'Enter an amount' }, { k: 'initial', label: 'Initial share capital (₱)', type: 'number', val: 1000 }]),
        foot: '<button class="btn" data-mx>Cancel</button><button class="btn primary" id="sv">Add member</button>',
        mount: function (m) { m.querySelector('#sv').onclick = function () { var v = K.readForm(m); if (!v) return; var id = 'M-' + String(K.db.members.length + 1).padStart(3, '0'); K.db.members.push({ id: id, name: v.name, dept: v.dept, joined: K.day(0), status: 'Active', email: v.email, monthly: v.monthly }); if (v.initial > 0) K.db.deposits.push({ id: K.uid('d'), member: id, date: K.day(0), amount: v.initial, type: 'Share capital', note: 'Membership fee' }); K.save(); K.closeModal(); K.toast(v.name + ' added as ' + id); K.route(); openMember(id); }; } });
    };
    draw();
  }

  var DF = { type: 'all', m: 'all' };
  function depositsView(el) {
    var mine = isMember() ? ME_MEMBER : null;
    var monthsOpt = []; for (var i = 0; i < 12; i++) { var d = K.today(); d.setDate(1); d.setMonth(d.getMonth() - i); monthsOpt.push([d.getFullYear() + '-' + d.getMonth(), d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })]); }
    el.innerHTML = '<div class="page-head"><div><h2>' + (mine ? 'My transactions' : 'Deposits & transactions') + '</h2><p>Share capital, savings, dividends and withdrawals.</p></div>' + (mine ? '' : '<div class="actions"><button class="btn" id="bulk"><i class="ti ti-users"></i>Payroll deductions</button><button class="btn primary" id="dep"><i class="ti ti-plus"></i>Record deposit</button></div>') + '</div>' +
      '<div class="card"><div class="toolbar"><select class="sel" id="ty"><option value="all">All types</option>' + ['Share capital', 'Savings', 'Dividend', 'Withdrawal'].map(function (t) { return '<option' + (DF.type === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select><select class="sel" id="mo"><option value="all">All months</option>' + monthsOpt.map(function (o) { return '<option value="' + o[0] + '"' + (DF.m === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select><span class="muted" id="cnt" style="margin-left:auto"></span></div><div class="tbl-wrap" id="tw"></div></div>';
    function draw() {
      var rows = deps(mine).filter(function (d) { if (DF.type !== 'all' && d.type !== DF.type) return false; if (DF.m !== 'all') { var t = K.parse(d.date); if (t.getFullYear() + '-' + t.getMonth() !== DF.m) return false; } return true; }).sort(K.by('date', true));
      var tot = K.sum(rows, function (d) { return d.type === 'Withdrawal' ? -d.amount : d.amount; });
      el.querySelector('#cnt').innerHTML = rows.length + ' transactions · net <b>' + P(tot, 2) + '</b>';
      el.querySelector('#tw').innerHTML = '<table class="tbl"><thead><tr><th>Date</th><th>Member</th><th>Type</th><th>Reference</th><th class="num">Amount</th></tr></thead><tbody>' + rows.slice(0, 80).map(function (d) { var w = d.type === 'Withdrawal'; return '<tr class="click" data-m="' + d.member + '"><td class="nowrap">' + K.dfmt(d.date) + '</td><td>' + E(mem(d.member).name) + '</td><td>' + K.badge(d.type, d.type === 'Share capital' ? 'acc' : d.type === 'Dividend' ? 'ok' : w ? 'bad' : 'info') + '</td><td class="muted">' + E(d.note || '') + '</td><td class="num" style="font-weight:600;color:' + (w ? 'var(--bad)' : 'var(--ok)') + '">' + (w ? '−' : '+') + P(d.amount, 2) + '</td></tr>'; }).join('') + '</tbody></table>';
      wire(el);
    }
    el.querySelector('#ty').onchange = function (e) { DF.type = e.target.value; draw(); };
    el.querySelector('#mo').onchange = function (e) { DF.m = e.target.value; draw(); };
    var b = el.querySelector('#dep'); if (b) b.onclick = function () { depositModal(); };
    b = el.querySelector('#bulk'); if (b) b.onclick = bulkModal;
    draw();
  }

  var LT = 'Active';
  function loansView(el) {
    var L = isMember() ? loans(ME_MEMBER) : K.db.loans;
    var tabs = ['Pending', 'Active', 'Paid', 'Rejected'];
    var rows = L.filter(function (l) { return l.status === LT; });
    el.innerHTML = '<div class="page-head"><div><h2>' + (isMember() ? 'My loans' : 'Loans') + '</h2><p>1% monthly interest on the diminishing balance. Members can borrow up to 3× their share capital.</p></div><div class="actions"><button class="btn primary" id="nl"><i class="ti ti-plus"></i>' + (isMember() ? 'Apply for a loan' : 'New loan') + '</button></div></div>' +
      (isMember() ? '' : '<div class="grid g-4">' + kpi('ti-cash', 'Outstanding', P(K.sum(L, bal)), '<span class="delta">' + L.filter(function (l) { return l.status === 'Active'; }).length + ' active loans</span>') + kpi('ti-hourglass', 'Awaiting approval', P(K.sum(L.filter(function (l) { return l.status === 'Pending'; }), function (l) { return l.principal; })), '<span class="delta">' + L.filter(function (l) { return l.status === 'Pending'; }).length + ' applications</span>') + kpi('ti-trending-up', 'Interest collected', P(interestAll()), '<span class="delta up">All time</span>') + kpi('ti-circle-check', 'Fully paid', L.filter(function (l) { return l.status === 'Paid'; }).length, '<span class="delta">0 defaults</span>') + '</div>') +
      '<div class="card"><div class="tabs">' + tabs.map(function (t) { return '<button class="tab' + (LT === t ? ' active' : '') + '" data-t="' + t + '">' + t + ' <span class="muted">' + L.filter(function (l) { return l.status === t; }).length + '</span></button>'; }).join('') + '</div>' +
      (rows.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Loan</th><th>Member</th><th>Purpose</th><th class="num">Amount</th><th class="num">Monthly</th><th style="min-width:140px">Progress</th><th class="num">Balance</th><th>' + (LT === 'Active' ? 'Next due' : 'Applied') + '</th></tr></thead><tbody>' + rows.map(function (l) { return '<tr class="click" data-loan="' + l.id + '"><td><b>' + E(l.id) + '</b></td><td>' + E(mem(l.member).name) + '</td><td>' + E(l.purpose) + '</td><td class="num">' + P(l.principal) + '</td><td class="num">' + P(amort(l.principal, l.term), 2) + '</td><td><div class="bar"><span style="width:' + Math.round(100 * l.payments.length / l.term) + '%"></span></div><small class="muted">' + l.payments.length + ' of ' + l.term + '</small></td><td class="num">' + P(bal(l), 2) + '</td><td class="nowrap">' + (LT === 'Active' ? K.dshort(nextDue(l)) : K.dshort(l.applied)) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">No ' + LT.toLowerCase() + ' loans.</div>') + '</div>';
    el.querySelectorAll('[data-t]').forEach(function (b) { b.onclick = function () { LT = b.dataset.t; K.route(); }; });
    el.querySelector('#nl').onclick = function () { loanModal(isMember() ? ME_MEMBER : null); };
    wire(el);
  }

  var DIV = { pct: 70 };
  function dividendsView(el) {
    var A = K.db.members.filter(function (m) { return m.status === 'Active'; }), tot = K.sum(A, function (m) { return share(m.id); });
    var ytd = interestYTD(), pool = ytd * DIV.pct / 100, rate = tot ? pool / tot : 0, year = new Date().getFullYear();
    var posted = K.db.dividends.indexOf(year) > -1;
    var list = isMember() ? A.filter(function (m) { return m.id === ME_MEMBER; }) : A;
    el.innerHTML = '<div class="page-head"><div><h2>Dividends</h2><p>Interest earned from member loans is shared back to members based on their share capital.</p></div></div>' +
      '<div class="grid g-4">' + kpi('ti-trending-up', 'Interest earned ' + year, P(ytd, 2), '<span class="delta">From loan payments</span>') + kpi('ti-percentage', 'Share to distribute', DIV.pct + '%', '<span class="delta">Rest kept as reserve fund</span>') + kpi('ti-gift', 'Dividend pool', P(pool, 2), '<span class="delta up">' + (rate * 100).toFixed(2) + '% return on share capital</span>') + kpi('ti-users', 'Eligible members', A.length, '<span class="delta">' + P(tot) + ' total share capital</span>') + '</div>' +
      (isMember() ? '' : '<div class="card"><div class="card-b row" style="justify-content:space-between"><div class="row" style="flex:1;min-width:240px"><label for="pct"><b>Distribute</b></label><input type="range" id="pct" min="30" max="100" step="5" value="' + DIV.pct + '" style="flex:1;accent-color:var(--accent)"><b id="pv">' + DIV.pct + '%</b></div><button class="btn primary" id="post"' + (posted ? ' disabled' : '') + '><i class="ti ti-send"></i>' + (posted ? 'Posted for ' + year : 'Post dividends to member savings') + '</button></div></div>') +
      '<div class="card"><div class="card-h"><h3>Allocation by member</h3><small>Dividend = share capital × ' + (rate * 100).toFixed(2) + '%</small></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Member</th><th class="num">Share capital</th><th>Share of fund</th><th class="num">Dividend</th></tr></thead><tbody>' +
      list.slice().sort(function (a, b) { return share(b.id) - share(a.id); }).map(function (m) { var s = share(m.id); return '<tr class="click" data-m="' + m.id + '"><td><div class="cell-main">' + K.avatar(m.name, '#15803D') + '<b>' + E(m.name) + '</b></div></td><td class="num">' + P(s) + '</td><td><span class="health"><span class="bar"><span style="width:' + (100 * s / (tot || 1) * 4) + '%"></span></span><small>' + (100 * s / (tot || 1)).toFixed(1) + '%</small></span></td><td class="num" style="color:var(--ok);font-weight:600">' + P(s * rate, 2) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
    var pc = el.querySelector('#pct'); if (pc) { pc.oninput = function () { el.querySelector('#pv').textContent = pc.value + '%'; }; pc.onchange = function () { DIV.pct = +pc.value; K.route(); }; }
    var po = el.querySelector('#post'); if (po) po.onclick = function () { K.modal({ title: 'Post ' + year + ' dividends?', body: '<p class="mt0">This credits <b>' + P(pool, 2) + '</b> to ' + A.length + ' members’ savings, based on their share capital.</p>', foot: '<button class="btn" data-mx>Cancel</button><button class="btn primary" id="go">Post dividends</button>', mount: function (m) { m.querySelector('#go').onclick = function () { A.forEach(function (x) { var amt = Math.round(share(x.id) * rate * 100) / 100; if (amt > 0) K.db.deposits.push({ id: K.uid('d'), member: x.id, date: K.day(0), amount: amt, type: 'Dividend', note: year + ' dividend' }); }); K.db.dividends.push(year); K.save(); K.closeModal(); K.toast('Dividends posted to ' + A.length + ' members'); K.route(); }; } }); };
    wire(el);
  }

  K.start({
    key: 'coop', name: 'Co-op Fund & Lending', tagline: 'Team cooperative portal', icon: 'ti-pig-money',
    accent: '#15803D', accent2: '#86EFAC', accentSoft: 'rgba(21,128,61,.1)', currency: 'PHP', searchPh: 'Search members…',
    roles: [{ v: 'treasurer', l: 'Treasurer' }, { v: 'member', l: 'Member (Ana)' }],
    me: me, seed: seed,
    nav: [
      { id: 'dashboard', label: 'Overview', icon: 'ti-layout-dashboard' },
      { id: 'members', label: 'Members', icon: 'ti-users' },
      { id: 'deposits', label: 'Deposits', icon: 'ti-arrows-exchange' },
      { id: 'loans', label: 'Loans', icon: 'ti-cash', count: function () { return isMember() ? 0 : K.db.loans.filter(function (l) { return l.status === 'Pending'; }).length; } },
      { id: 'dividends', label: 'Dividends', icon: 'ti-gift', group: 'Year-end' }],
    views: { dashboard: dashboard, members: membersView, deposits: depositsView, loans: loansView, dividends: dividendsView },
    onSearch: function (q) { F.q = q; F.st = 'all'; K.go('members'); },
    notifications: function () {
      var p = isMember() ? [] : K.db.loans.filter(function (l) { return l.status === 'Pending'; });
      return '<div class="list">' + p.map(function (l) { return '<div class="li"><span class="ico-sq" style="background:var(--warn-bg);color:var(--warn)"><i class="ti ti-file-dollar"></i></span><div class="grow"><b>Loan application from ' + E(mem(l.member).name) + '</b><small>' + P(l.principal) + ' · ' + E(l.purpose) + '</small></div></div>'; }).join('') + '<div class="li"><span class="ico-sq"><i class="ti ti-calendar"></i></span><div class="grow"><b>Payroll deductions due</b><small>Post this month’s share capital on the 15th</small></div></div></div>';
    }
  });
})();

</script>
</body>
</html>
